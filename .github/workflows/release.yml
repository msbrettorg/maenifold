# T-9.5: RTM FR-9 (RTM-062, RTM-063, RTM-064, RTM-065)
name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # T-9.5: RTM FR-9 (RTM-062) - Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: maenifold-osx-arm64
          # T-9.5: RTM FR-9 (RTM-063) - Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: maenifold-linux-x64
          # T-9.5: RTM FR-9 (RTM-064) - Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: maenifold-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI deps (gtk/appindicator for tray-icon)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build maenifold-cli
        run: cargo build --release --target ${{ matrix.target }} -p maenifold-cli

      - name: Build maenifold-pipeline-driver
        run: cargo build --release --target ${{ matrix.target }} -p maenifold-pipeline-driver

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/maenifold" staging/
          cp "target/${{ matrix.target }}/release/maenifold-pipeline-driver" staging/
          # T-9.5: RTM FR-9 (RTM-065) - bundle release assets but exclude ONNX models
          rsync -a --exclude='*.onnx' assets/ staging/assets/
          for f in readme.md CHANGELOG.md AGENTS.md; do
            if [ -f "$f" ]; then cp "$f" staging/; fi
          done
          cd staging && zip -r "../${{ matrix.artifact }}.zip" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/maenifold.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/maenifold-pipeline-driver.exe" staging/
          # T-9.5: RTM FR-9 (RTM-065) - bundle release assets but exclude ONNX models
          $source = "assets"
          $dest = "staging/assets"
          Get-ChildItem -Path $source -Recurse -File | Where-Object { $_.Extension -ne '.onnx' } | ForEach-Object {
            $relativePath = $_.FullName.Substring((Resolve-Path $source).Path.Length + 1)
            $destPath = Join-Path $dest $relativePath
            $destDir = Split-Path $destPath -Parent
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item $_.FullName $destPath
          }
          foreach ($f in @('readme.md', 'CHANGELOG.md', 'AGENTS.md')) {
            if (Test-Path $f) { Copy-Item $f staging/ }
          }
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Smoke test binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./staging/maenifold.exe --version || ./staging/maenifold.exe --help | head -n 1
            ./staging/maenifold-pipeline-driver.exe --help 2>&1 | head -n 1 || true
          else
            ./staging/maenifold --version || ./staging/maenifold --help | head -n 1
            ./staging/maenifold-pipeline-driver --help 2>&1 | head -n 1 || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
