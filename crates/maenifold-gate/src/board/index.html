<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--surface:#131313;--surface-low:#1c1b1b;--surface-container:#201f1f;--surface-high:#2a2a2a;--surface-highest:#353534;--on-surface:#e5e2e1;--on-surface-var:#c4c6d0;--outline-variant:#44474f;--primary:#d8e2ff;--primary-container:#adc6ff;--secondary:#d0bcff;--tertiary:#4edea3;--error:#ffb4ab;--radius:4px}
    *{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--surface);color:var(--on-surface);font:14px/1.4 Inter,sans-serif}button,input,select{font:inherit}button,input,select{background:none;color:inherit;border:0}button{cursor:pointer}
    .topbar,.filters,.drawer-head,.drawer-actions{display:flex;align-items:center}.topbar{flex-shrink:0;justify-content:space-between;gap:16px;padding:12px 16px;background:var(--surface-low);border-bottom:1px solid var(--outline-variant)}.brand{font:700 22px/1 "Space Grotesk",sans-serif}.brand span{color:var(--primary-container)}.project{min-width:220px;padding:8px 10px;border:1px solid var(--outline-variant);border-radius:var(--radius);background:var(--surface-container)}.statusline,.stats,.filters,.toggles,.pills,.layout,.stage-row,.drawer-meta{display:flex;gap:12px}.statusline{align-items:center;justify-content:flex-end;flex:1 1 auto;min-width:0;flex-wrap:wrap}.stat,.pill,.badge,.seg,.machine{display:inline-flex;align-items:center;gap:8px}.stat,.pill,.badge,.seg{font:500 12px/1 "JetBrains Mono",monospace}.pulse,.swatch,.node-dot{width:8px;height:8px;border-radius:50%}.pulse{background:var(--outline-variant)}.pulse.live{background:var(--primary-container);animation:pulse 1.4s infinite}.pulse.done{background:var(--tertiary)}
    .filters{flex-shrink:0;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:var(--surface-container);border-bottom:1px solid var(--outline-variant)}.toggles{gap:8px}.seg{padding:8px 10px;border:1px solid var(--outline-variant);border-radius:var(--radius);color:#8e909a}.seg.active{color:var(--primary);background:var(--surface-high)}.pills{flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid var(--outline-variant);border-radius:var(--radius);color:#8e909a;text-transform:uppercase}.pill.active.sdd{color:var(--primary-container);background:#1c2d5a;border-color:#adc6ff55}.pill.active.tdd{color:var(--secondary);background:#2d2050;border-color:#d0bcff55}.pill.active.gsd{color:var(--tertiary);background:#002d20;border-color:#4edea355}.pill.active.lightweight{color:var(--on-surface-var);background:var(--surface-high)}.search{width:min(320px,100%);padding:8px 0;border-bottom:1px solid var(--outline-variant);font-family:"JetBrains Mono",monospace}
    .message{max-width:min(320px,100%);color:#8e909a;font:12px/1.3 "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message.error{color:var(--error)}.layout{flex:1;min-height:0;overflow:hidden;position:relative;align-items:flex-start}.main{flex:1;min-width:0;min-height:0;overflow:hidden}.table-wrap{height:100%;overflow:auto}.board{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}.board th,.board td{padding:14px 16px;border-bottom:1px solid #26282d;text-align:left;vertical-align:middle}.board th{position:sticky;top:0;z-index:2;background:var(--surface);font:500 11px/1 "JetBrains Mono",monospace;color:#8e909a;text-transform:uppercase;letter-spacing:.08em}.board tr:nth-child(odd){background:var(--surface)}.board tr:nth-child(even){background:var(--surface-low)}.board tr:hover{background:var(--surface-container)}.board tr.selected{outline:1px solid var(--outline-variant);outline-offset:-1px}.board td.progress{overflow:hidden}.id,.req,.modified,.meta{font-family:"JetBrains Mono",monospace;color:#8e909a}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{padding:4px 8px;border-radius:var(--radius);text-transform:uppercase}.badge.sdd{color:var(--primary-container);background:#1c2d5a}.badge.tdd{color:var(--secondary);background:#2d2050}.badge.gsd{color:var(--tertiary);background:#002d20}.badge.lightweight,.badge.unknown{color:var(--on-surface-var);background:var(--surface-high)}
    .machine{align-items:flex-start;gap:8px;min-width:max-content}.machine.compact{gap:6px}.node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:44px}.machine.compact .node{min-width:auto}.node-dot{border:1px solid var(--outline-variant);background:transparent}.node.done .node-dot{background:var(--primary-container);border-color:var(--primary-container)}.node.current .node-dot{background:var(--primary-container);border-color:var(--primary-container);box-shadow:0 0 6px #adc6ff80}.node-label{font:11px/1 "JetBrains Mono",monospace;color:#8e909a}.node.done .node-label,.node.current .node-label{color:var(--on-surface-var)}.link{width:22px;height:1px;margin-top:4px;background:var(--outline-variant)}.machine.compact .link{width:12px}.link.done{background:var(--primary-container)}.unknown-machine .node{min-width:auto}
    .drawer{position:absolute;top:0;right:0;width:400px;height:100%;transform:translateX(100%);transition:transform .18s ease;background:var(--surface-container);border-left:1px solid var(--outline-variant);overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;justify-content:space-between;padding:16px;background:var(--surface-container);border-bottom:1px solid var(--outline-variant)}.drawer-title{display:grid;gap:4px}.drawer-title strong{font:700 20px/1 "Space Grotesk",sans-serif}.close{font-size:24px;line-height:1;color:#8e909a}.drawer-body{display:grid;gap:18px;padding:16px}.drawer-meta{flex-wrap:wrap;gap:8px}.meta{padding:6px 8px;border:1px solid var(--outline-variant);border-radius:var(--radius)}.notes{display:grid;gap:10px}.note{padding:12px;border:1px solid var(--outline-variant);border-radius:var(--radius);background:var(--surface-low)}.note h4,.section-title{margin:0 0 8px;font:500 11px/1 "JetBrains Mono",monospace;color:#8e909a;text-transform:uppercase;letter-spacing:.08em}.note pre{margin:0;white-space:pre-wrap;font:13px/1.45 Inter,sans-serif}.stage-list{display:grid;gap:10px}.stage-row{justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2b2d33}.stage-row:last-child{border-bottom:0}.drawer-actions{position:sticky;bottom:0;justify-content:space-between;padding:16px;background:var(--surface-container);border-top:1px solid var(--outline-variant)}.action{padding:9px 12px;border:1px solid var(--outline-variant);border-radius:var(--radius);font:500 12px/1 "JetBrains Mono",monospace;text-transform:uppercase}.pass{color:#002114;background:var(--tertiary)}.reject{color:#690005;background:var(--error)}.action[disabled]{opacity:.45;cursor:not-allowed}
    @keyframes pulse{50%{opacity:.45}}@media (max-width:920px){.layout{display:block}.drawer{width:min(400px,100vw)}.board th:nth-child(5),.board td:nth-child(5){display:none}}@media (max-width:700px){.stats{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">gate <span id="port-label">:--</span></div>
    <select id="project" class="project" aria-label="Project selector"></select>
    <div class="statusline">
      <div class="stats">
        <span class="stat"><span class="pulse"></span><span id="stat-pending">0 pending</span></span>
        <span class="stat"><span class="pulse live"></span><span id="stat-flight">0 in-flight</span></span>
        <span class="stat"><span class="pulse done"></span><span id="stat-done">0 done</span></span>
      </div>
      <div id="message" class="message">Connecting…</div>
    </div>
  </header>
  <section class="filters">
    <div class="toggles" id="scope"></div>
    <div class="pills" id="pipelines"></div>
    <input id="search" class="search" type="search" placeholder="search tasks">
  </section>
  <div class="layout">
    <main class="main">
      <div class="table-wrap">
        <table class="board">
          <colgroup><col style="width:80px"><col><col style="width:90px"><col style="width:140px"><col style="width:100px"><col style="width:80px"></colgroup>
          <thead><tr><th>ID</th><th>Title</th><th>Pipeline</th><th>Progress</th><th>Requirement</th><th>Modified</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <aside id="drawer" class="drawer" aria-live="polite"></aside>
  </div>
  <template id="empty-row"><tr><td colspan="6" class="meta">No matching tasks.</td></tr></template>
  <script type="module">
    const PORT=(document.querySelector('meta[name="gate-port"]')?.content)||'--',SDK='https://esm.sh/@modelcontextprotocol/sdk@1.22.0',SCOPE=['all','backlog','in-flight','done'],PIPES=['sdd','tdd','gsd','lightweight'],PIPELINES={sdd:{steps:['pending','swe','red','blue','done']},tdd:{steps:['pending','test','swe','verify','done'],map:s=>s==='implement'?'swe':s},gsd:{steps:['pending','swe','done'],map:s=>['research','plan','execute','verify'].includes(s)?'swe':s},lightweight:{steps:['pending','done'],map:s=>s==='done'?'done':'pending'}},state={client:null,gates:[],tasks:[],scope:'all',search:'',selectedGate:new URLSearchParams(location.search).get('gate')||'',selectedTask:null,pipelines:Object.fromEntries(PIPES.map(p=>[p,true]))};
    document.getElementById('port-label').textContent=`:${PORT}`;
    const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),qs=id=>document.getElementById(id),msg=(t,e=false)=>{const n=qs('message');n.innerHTML=esc(t);n.className=`message${e?' error':''}`},rel=iso=>{if(!iso)return'—';const d=new Date(iso),s=Math.max(1,Math.floor((Date.now()-d.getTime())/1000)),u=[[31536000,'y'],[86400,'d'],[3600,'h'],[60,'m']].find(([n])=>s>=n);return u?`${Math.floor(s/u[0])}${u[1]} ago`:'just now'},json=result=>{const text=result?.content?.find(c=>c.type==='text')?.text;if(!text)return null;try{return JSON.parse(text)}catch{return text}};
    async function connect(){const[{Client},{StreamableHTTPClientTransport}]=await Promise.all([import(`${SDK}/client/index.js?bundle`),import(`${SDK}/client/streamableHttp.js?bundle`)]),browserFetch=globalThis.fetch.bind(globalThis),endpoint=new URL('/mcp',location.origin),transport=new StreamableHTTPClientTransport(endpoint,{fetch:(input,init)=>{const method=String(init?.method||'GET').toUpperCase(),url=String(input instanceof Request?input.url:input);return method==='GET'&&url===endpoint.toString()?Promise.resolve(new Response(null,{status:405,statusText:'Method Not Allowed'})):browserFetch(input,init)}}),client=new Client({name:'gate-board',version:'1.0'});await client.connect(transport);state.client=client}
    async function tool(name,args={}){return json(await state.client.callTool({name,arguments:args}))}
    const taskId=t=>t.id||String(t.file||'').replace(/\.md$/,''),statusOf=t=>String(t.status||'pending').toLowerCase(),doneLike=t=>['done','reject','rejected'].includes(statusOf(t)),directPipe=t=>{const seen=new Set([statusOf(t),...(t.stages||[]).map(s=>String(s.name||'').toLowerCase())]);if([...seen].some(s=>['test','implement','verify'].includes(s)))return'tdd';if([...seen].some(s=>['research','plan','execute'].includes(s)))return'gsd';if(seen.has('red'))return'sdd';if(seen.has('blue')&&!seen.has('red'))return'lightweight';return null},gatePipe=tasks=>tasks.map(directPipe).find(Boolean)||'sdd',pipeOf=(t,fallback)=>directPipe(t)||fallback||'unknown',pipeLabel=p=>p==='lightweight'?'lightweight':p,pipeNorm=(p,s)=>((PIPELINES[p]?.map||((x)=>x))(s)),currentStep=t=>{const p=t.pipeline,steps=PIPELINES[p]?.steps;if(!steps)return statusOf(t);if(doneLike(t))return steps[steps.length-1];const raw=pipeNorm(p,statusOf(t));if(p==='lightweight'&&statusOf(t)!=='pending')return steps[steps.length-1];return steps.includes(raw)?raw:steps[0]};
    function summarize(task,gate,fallback){delete task.sections;return{...task,id:taskId(task),root:gate.root,gate:gate.name,pipeline:pipeOf(task,fallback),modifiedAt:task.modified||gate.registered_at||null}}
    function updateQuery(){const url=new URL(location.href);state.selectedGate?url.searchParams.set('gate',state.selectedGate):url.searchParams.delete('gate');history.replaceState({},'',url)}
    function renderControls(){qs('scope').innerHTML=SCOPE.map(s=>`<button class="seg${state.scope===s?' active':''}" data-scope="${s}">${s}</button>`).join('');qs('pipelines').innerHTML=PIPES.map(p=>`<button class="pill ${p}${state.pipelines[p]?' active':''}" data-pipe="${p}">${pipeLabel(p)}</button>`).join('');qs('project').innerHTML=state.gates.map(g=>`<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('')||'<option value="">No gates</option>';if(!state.selectedGate&&state.gates[0])state.selectedGate=state.gates[0].name;qs('project').value=state.selectedGate}
    function renderStats(){const items=state.tasks,flight=items.filter(t=>statusOf(t)!=='pending'&&!doneLike(t)).length;qs('stat-pending').textContent=`${items.filter(t=>statusOf(t)==='pending').length} pending`;qs('stat-flight').textContent=`${flight} in-flight`;qs('stat-done').textContent=`${items.filter(doneLike).length} done`}
    function visible(){return state.tasks.filter(t=>state.pipelines[t.pipeline]&&({all:1,backlog:statusOf(t)==='pending','in-flight':statusOf(t)!=='pending'&&!doneLike(t),done:doneLike(t)})[state.scope]&&(state.search.trim()===''||[t.id,t.title,t.requirement,t.pipeline].some(v=>String(v||'').toLowerCase().includes(state.search.toLowerCase())))).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}))}
    function machine(task,full=false){const spec=PIPELINES[task.pipeline],label=step=>full?`<span class="node-label">${esc(step)}</span>`:'';if(!spec)return`<div class="machine${full?'':' compact'} unknown-machine"><div class="node current"><span class="node-dot"></span>${label(statusOf(task))}</div></div>`;const current=currentStep(task),steps=spec.steps,ix=steps.indexOf(current);return`<div class="machine${full?'':' compact'}">${steps.map((step,i)=>{const done=i<ix||doneLike(task)&&i<=ix,cur=i===ix;return`<div class="node${done?' done':''}${cur?' current':''}"><span class="node-dot"></span>${label(step)}</div>${i<steps.length-1?`<span class="link${i<ix?' done':''}"></span>`:''}`}).join('')}</div>`}
    function renderRows(){const items=visible(),body=qs('rows');if(!items.length){body.innerHTML=qs('empty-row').innerHTML;return}body.innerHTML=items.map(t=>`<tr data-id="${esc(t.id)}" class="${state.selectedTask?.id===t.id?'selected':''}"><td class="id">${esc(t.id)}</td><td class="title">${esc(t.title||t.id)}</td><td><span class="badge ${t.pipeline}">${esc(t.pipeline)}</span></td><td class="progress">${machine(t)}</td><td class="req">${esc(t.requirement||'—')}</td><td class="modified">${esc(rel(t.modifiedAt))}</td></tr>`).join('')}
    function transitions(task){const seen=(task.stages||[]).map(s=>({name:String(s.name||'').toLowerCase(),verdict:s.verdict||'—'}));const current=statusOf(task);return machine(task,true)+`<div class="stage-list">${(PIPELINES[task.pipeline]?.steps||[current]).map(step=>{const hit=seen.find(s=>pipeNorm(task.pipeline,s.name)===step)||null,active=currentStep(task)===step,label=hit?.verdict||(active?'active':'pending');return`<div class="stage-row"><span class="meta">${esc(step)}</span><span class="meta">${esc(label)}</span><span class="modified">—</span></div>`}).join('')}</div>`}
    function renderDrawer(){const d=qs('drawer'),t=state.selectedTask;if(!t){d.className='drawer';d.innerHTML='';return}const locked=t.location==='done';d.className='drawer open';d.innerHTML=`<div class="drawer-head"><div class="drawer-title"><strong>${esc(t.id)}</strong><span>${esc(t.title||t.id)}</span></div><button class="close" id="close-drawer" aria-label="Close">×</button></div><div class="drawer-body"><div class="drawer-meta"><span class="meta">${esc(pipeLabel(t.pipeline))}</span><span class="meta">${esc(t.requirement||'—')}</span><span class="meta">${esc(statusOf(t))}</span></div><section><h3 class="section-title">State machine</h3>${transitions(t)}</section><section><h3 class="section-title">Agent notes</h3><div class="notes">${(t.sections||[]).filter(s=>s.body).map(s=>`<article class="note"><h4>${esc(s.heading)}</h4><div class="drawer-meta"><span class="meta">${esc(s.stage)}</span>${s.verdict?`<span class="meta">${esc(s.verdict)}</span>`:''}</div><pre>${esc(s.body)}</pre></article>`).join('')||'<div class="meta">No notes available.</div>'}</div></section></div><div class="drawer-actions"><button class="action reject" id="reject-task" ${locked?'disabled':''}>Reject</button><button class="action pass" id="pass-task" ${locked?'disabled':''}>Pass</button></div>`;qs('close-drawer').onclick=()=>{state.selectedTask=null;render()};if(!locked){qs('pass-task').onclick=()=>transition('gate_pass');qs('reject-task').onclick=()=>transition('gate_reject')}}
    function render(){renderControls();renderStats();renderRows();renderDrawer()}
    async function loadGates(){state.gates=(await tool('gate_list_gates'))?.gates||[];if(!state.gates.some(g=>g.name===state.selectedGate))state.selectedGate=state.gates[0]?.name||''}
    async function loadTasks(){const gate=state.gates.find(g=>g.name===state.selectedGate);if(!gate)return state.tasks=[];const raw=await tool('gate_status',{root:gate.root})||[],fallback=gatePipe(raw);state.tasks=raw.map(t=>summarize(t,gate,fallback));if(state.selectedTask){const next=state.tasks.find(t=>t.id===state.selectedTask.id);state.selectedTask=next?{...next,...state.selectedTask}:null}}
    async function loadDetail(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;state.selectedTask={...task,sections:state.selectedTask?.sections||[]};render();try{const detail=await tool('gate_status',{root:task.root,id})||task;state.selectedTask={...task,...detail,id:taskId(detail),pipeline:pipeOf(detail,task.pipeline),root:task.root,gate:task.gate}}catch(err){msg(err.message||String(err),true)}render()}
    async function transition(name){const t=state.selectedTask;if(!t)return;const notes=prompt(`${name==='gate_pass'?'Pass':'Reject'} notes (optional):`);if(notes===null)return;try{await tool(name,{id:t.id,root:t.root,notes:notes||undefined});await loadTasks();await loadDetail(t.id);msg(`${t.id}: ${name==='gate_pass'?'pass':'reject'} recorded.`)}catch(err){msg(err.message||String(err),true)}render()}
    async function refresh(){try{msg('Loading board…');await loadGates();updateQuery();await loadTasks();render();msg(`Loaded ${visible().length} tasks.`)}catch(err){msg(err.message||String(err),true)}}
    qs('project').onchange=e=>{state.selectedGate=e.target.value;state.selectedTask=null;updateQuery();refresh()};qs('search').oninput=e=>{state.search=e.target.value;render()};qs('scope').onclick=e=>{const b=e.target.closest('[data-scope]');if(!b)return;state.scope=b.dataset.scope;render()};qs('pipelines').onclick=e=>{const b=e.target.closest('[data-pipe]');if(!b)return;state.pipelines[b.dataset.pipe]=!state.pipelines[b.dataset.pipe];render()};qs('rows').onclick=e=>{const row=e.target.closest('[data-id]');if(row)loadDetail(row.dataset.id)};
    await connect();await refresh();setInterval(refresh,30000);
  </script>
</body>
</html>
