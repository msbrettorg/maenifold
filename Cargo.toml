[workspace]
members = [
  "crates/maenifold-core",
  "crates/maenifold-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["MSBrett"]
repository = "https://github.com/msbrettorg/maenifold"

[workspace.dependencies]
# Evaluated but deferred: unstable_session_fork (needs pipeline integration), unstable_message_id (needs prompt correlation)
agent-client-protocol = { version = "0.10", features = ["unstable_session_close", "unstable_session_model", "unstable_session_usage"] }
anyhow = "1.0.100"
axum = "0.8"
chrono = { version = "0.4.42", features = ["serde"] }
once_cell = "1.21.3"
parking_lot = "0.12.5"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.12.2"
rmcp = { version = "1.1.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.38.0", features = ["bundled", "functions", "load_extension", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_yaml = "0.9.34"
slug = "0.1.6"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# T-17.2: RTM FR-23 (RTM-127, RTM-129, RTM-130) - HTTP transport needs networking and
# SIGINT handling for graceful shutdown.
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "io-std", "sync", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tower-http = { version = "0.6", features = ["cors"] }
walkdir = "2.5.0"
gray_matter = "0.3.2"
pulldown-cmark = "0.13.0"
sha2 = "0.10.9"
base64 = "0.22.1"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
tokenizers = "0.22.2"
tao = "0.34"
tray-icon = "0.19"
wry = "0.48"
notify = { version = "6", features = ["macos_fsevent"] }
rust-embed = "8"
directories = "6"
open = "5"
tempfile = "3.23.0"
assert_cmd = "2.1.1"
predicates = "3.1.3"
similar-asserts = "1.7.0"
urlencoding = "2.1.3"
libc = "0.2"
async-trait = "0.1"

[package]
name = "maenifold-rs-workspace"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
maenifold-core = { path = "crates/maenifold-core" }
regex.workspace = true
serde_json.workspace = true
