<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#201f1f",
            "on-secondary-fixed-variant": "#004495",
            "on-tertiary-fixed": "#210f48",
            "tertiary": "#d0bcff",
            "on-tertiary-container": "#3f2e67",
            "on-tertiary": "#37265e",
            "on-primary": "#003259",
            "surface-container-lowest": "#0e0e0e",
            "secondary-fixed": "#d8e2ff",
            "secondary-fixed-dim": "#adc6ff",
            "surface-container-high": "#2a2a2a",
            "outline-variant": "#404752",
            "primary-fixed": "#d2e4ff",
            "inverse-surface": "#e5e2e1",
            "inverse-primary": "#0061a5",
            "surface": "#131313",
            "primary-container": "#4da6ff",
            "inverse-on-surface": "#313030",
            "on-surface-variant": "#c0c7d4",
            "tertiary-container": "#ab98d8",
            "secondary-container": "#0061d0",
            "on-secondary-container": "#dae4ff",
            "tertiary-fixed": "#e9ddff",
            "surface-container-highest": "#353534",
            "on-error": "#690005",
            "primary": "#a0caff",
            "background": "#131313",
            "surface-bright": "#393939",
            "on-secondary": "#002e6a",
            "surface-dim": "#131313",
            "on-surface": "#e5e2e1",
            "tertiary-fixed-dim": "#d0bcff",
            "error-container": "#93000a",
            "surface-variant": "#353534",
            "surface-tint": "#a0caff",
            "outline": "#8a919d",
            "on-primary-fixed": "#001c37",
            "on-primary-fixed-variant": "#00497e",
            "on-primary-container": "#003a67",
            "on-background": "#e5e2e1",
            "surface-container-low": "#1c1b1b",
            "on-tertiary-fixed-variant": "#4d3d76",
            "error": "#ffb4ab",
            "on-error-container": "#ffdad6",
            "secondary": "#adc6ff",
            "primary-fixed-dim": "#a0caff",
            "on-secondary-fixed": "#001a42",
            "workflow": "#4d8eff",
            "prompt": "#adc6ff",
            "thinking": "#d0bcff",
            "tool": "#4edea3"
          },
          fontFamily: {
            "headline": ["Space Grotesk"],
            "body": ["Inter"],
            "label": ["JetBrains Mono"]
          },
          borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #404752; border-radius: 10px; }
  </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">
<!-- Background Interface (Blurred Content) -->
<div class="fixed inset-0 grid grid-cols-[260px_1fr_300px] gap-0 opacity-40 pointer-events-none">
<!-- Sidebar -->
<aside class="bg-surface-container-low border-r border-outline-variant/15 flex flex-col">
<div class="p-4 flex items-center gap-3">
<div class="w-8 h-8 rounded bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm">terminal</span>
</div>
<span class="font-headline font-bold text-xs tracking-widest text-primary uppercase">ENGINE_CORE</span>
</div>
<nav class="flex-1 px-2 space-y-1">
<div class="bg-surface-container text-primary border-l-4 border-primary px-4 py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-[18px]">account_tree</span>
<span class="font-label text-[10px] uppercase tracking-widest">Nodes</span>
</div>
<div class="text-on-surface-variant/40 px-4 py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-[18px]">bolt</span>
<span class="font-label text-[10px] uppercase tracking-widest">Triggers</span>
</div>
</nav>
</aside>
<!-- Main Canvas -->
<main class="bg-background flex flex-col">
<header class="h-14 border-b border-outline-variant/15 flex items-center px-6 justify-between">
<span class="font-headline font-bold uppercase tracking-[-2%] text-primary">Explorer / New_Flow</span>
<div class="flex gap-4">
<div class="h-8 w-32 bg-surface-container-lowest rounded"></div>
<div class="h-8 w-8 bg-surface-container rounded"></div>
</div>
</header>
<div class="flex-1 p-8 grid grid-cols-2 gap-8">
<div class="rounded-xl bg-surface-container border-l-4 border-workflow p-6 h-64 shadow-xl"></div>
<div class="rounded-xl bg-surface-container border-l-4 border-thinking p-6 h-64 shadow-xl"></div>
<div class="rounded-xl bg-surface-container border-l-4 border-tool p-6 h-96 shadow-xl col-span-2"></div>
</div>
</main>
<!-- Properties Panel -->
<aside class="bg-surface-container-low border-l border-outline-variant/15 p-4">
<div class="h-4 w-24 bg-outline-variant/20 mb-6"></div>
<div class="space-y-4">
<div class="h-12 bg-surface-container rounded"></div>
<div class="h-32 bg-surface-container-lowest rounded"></div>
</div>
</aside>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-[20px] bg-black/40">
<!-- Modal Container -->
<div class="w-[600px] bg-surface-container-highest/95 rounded-md shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-outline-variant/20 relative flex flex-col max-h-[921px] overflow-hidden" style="box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(160, 202, 255, 0.05);">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant/10">
<div>
<h2 class="font-headline text-[24px] font-bold tracking-tight text-on-surface">Create Workflow</h2>
<p class="text-[13px] text-on-surface-variant font-medium mt-0.5">Define a new workflow template for AI agent orchestration</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto px-6 py-6 space-y-6 custom-scrollbar">
<!-- Workflow ID & Display Name -->
<div class="grid grid-cols-2 gap-5">
<div class="space-y-1.5">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Workflow ID</label>
<input class="w-full bg-surface-container-lowest border-none rounded-[6px] px-3 py-2.5 text-on-surface font-label text-[13px] focus:ring-2 focus:ring-primary/40 placeholder:text-on-surface-variant/30" placeholder="e.g. abductive-reasoning" type="text"/>
<p class="text-[10px] text-on-surface-variant/60 italic px-1">Lowercase with hyphens. Must be unique.</p>
</div>
<div class="space-y-1.5">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Display Name</label>
<input class="w-full bg-surface-container-lowest border-none rounded-[6px] px-3 py-2.5 text-on-surface font-body text-[13px] focus:ring-2 focus:ring-primary/40 placeholder:text-on-surface-variant/30" placeholder="Abductive Reasoning" type="text"/>
</div>
</div>
<!-- Description -->
<div class="space-y-1.5">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Description</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-[6px] px-3 py-2.5 text-on-surface font-body text-[13px] focus:ring-2 focus:ring-primary/40 placeholder:text-on-surface-variant/30 resize-none" placeholder="Generates candidate hypotheses from surprising observations..." rows="3"></textarea>
</div>
<!-- Category Selector -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Category</label>
<div class="flex flex-wrap gap-1 bg-surface-container-lowest p-1 rounded-[6px]">
<button class="px-3 py-1.5 text-[11px] font-semibold rounded-[4px] bg-workflow/20 text-workflow">Reasoning</button>
<button class="px-3 py-1.5 text-[11px] font-medium rounded-[4px] text-on-surface-variant/60 hover:text-on-surface">Scientific</button>
<button class="px-3 py-1.5 text-[11px] font-medium rounded-[4px] text-on-surface-variant/60 hover:text-on-surface">Multi-Agent</button>
<button class="px-3 py-1.5 text-[11px] font-medium rounded-[4px] text-on-surface-variant/60 hover:text-on-surface">DevOps</button>
<button class="px-3 py-1.5 text-[11px] font-medium rounded-[4px] text-on-surface-variant/60 hover:text-on-surface">Memory</button>
<button class="px-3 py-1.5 text-[11px] font-medium rounded-[4px] text-on-surface-variant/60 hover:text-on-surface">Custom</button>
</div>
</div>
<!-- Configuration -->
<div class="space-y-4 pt-2">
<div class="flex items-center gap-4">
<h3 class="font-headline text-[14px] font-bold text-on-surface shrink-0 uppercase tracking-wide">Configuration</h3>
<div class="h-px bg-outline-variant/20 flex-1"></div>
</div>
<div class="grid grid-cols-2 gap-8 items-start">
<div class="space-y-4">
<div class="flex items-center justify-between">
<span class="text-[13px] font-medium text-on-surface">Sequential Thinking</span>
<button class="w-9 h-5 bg-thinking rounded-full relative flex items-center justify-end px-1 shadow-[0_0_10px_rgba(208,188,255,0.4)]">
<div class="w-3.5 h-3.5 bg-white rounded-full"></div>
</button>
</div>
<div class="flex items-center justify-between">
<span class="text-[13px] font-medium text-on-surface">Multi-Agent</span>
<button class="w-9 h-5 bg-surface-container-lowest rounded-full relative flex items-center justify-start px-1 border border-outline-variant/30">
<div class="w-3.5 h-3.5 bg-on-surface-variant/40 rounded-full"></div>
</button>
</div>
</div>
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Reasoning Effort</label>
<div class="grid grid-cols-3 bg-surface-container-lowest p-1 rounded-[6px]">
<button class="py-1 text-[11px] font-medium text-on-surface-variant/60">Low</button>
<button class="py-1 text-[11px] font-bold bg-[#F59E0B]/20 text-[#F59E0B] rounded-[4px]">Medium</button>
<button class="py-1 text-[11px] font-medium text-on-surface-variant/60">High</button>
</div>
</div>
</div>
</div>
<!-- Initial Steps -->
<div class="space-y-3 pt-2">
<label class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Initial Steps</label>
<div class="space-y-2">
<!-- Step 1 -->
<div class="flex items-center gap-3 bg-surface-container p-3 rounded-[6px] border-l-4 border-workflow">
<span class="material-symbols-outlined text-on-surface-variant cursor-grab">drag_indicator</span>
<input class="bg-transparent border-none p-0 text-[13px] font-medium text-on-surface focus:ring-0 flex-1" type="text" value="Define Problem Space"/>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Step 2 -->
<div class="flex items-center gap-3 bg-surface-container p-3 rounded-[6px] border-l-4 border-thinking">
<span class="material-symbols-outlined text-on-surface-variant cursor-grab">drag_indicator</span>
<input class="bg-transparent border-none p-0 text-[13px] font-medium text-on-surface focus:ring-0 flex-1" type="text" value="Generate Hypotheses"/>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
</div>
<button class="w-full py-2.5 border border-dashed border-outline-variant/30 rounded-[6px] text-[12px] font-medium text-on-surface-variant hover:bg-surface-container transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
            Add Step
          </button>
</div>
</div>
<!-- Footer -->
<div class="px-6 py-5 border-t border-outline-variant/10 bg-surface-container-highest flex justify-end items-center gap-4">
<button class="px-6 py-2.5 text-[14px] font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-[6px] transition-all">
          Cancel
        </button>
<button class="px-8 py-2.5 text-[14px] font-bold text-on-primary bg-secondary-fixed rounded-[6px] shadow-lg shadow-secondary-fixed/10 hover:shadow-secondary-fixed/20 active:scale-95 transition-all">
          Create Workflow
        </button>
</div>
</div>
</div>
<!-- Contextual FAB (Hidden but compliant with system) -->
<div class="fixed bottom-6 right-6 hidden md:block">
<button class="h-14 w-14 rounded-full bg-primary-container text-on-primary-container shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</body></html>
