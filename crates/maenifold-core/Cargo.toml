[package]
name = "maenifold-core"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
gray_matter.workspace = true
libc.workspace = true
mime_guess = { version = "2" }
notify = { version = "7", features = ["macos_fsevent"] }
once_cell.workspace = true
parking_lot.workspace = true
petgraph = { version = "0.8", features = ["stable_graph", "serde-1"] }
pulldown-cmark.workspace = true
regex.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
slug.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
tower-http.workspace = true
uuid.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
ort.workspace = true
tokenizers.workspace = true
ndarray = "0.16"
# T-29.2: RTM FR-35 — system tray icon for --web/--http modes on macOS.
tray-icon = "0.21"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[dev-dependencies]
assert_cmd.workspace = true
ctor = "0.4"
predicates.workspace = true
reqwest.workspace = true
serial_test = "3"
similar-asserts.workspace = true
tempfile.workspace = true
filetime = "0.2.25"

[[test]]
# T-HOTFIX: RTM NFR-3
name = "integration_tests"
path = "tests/main.rs"
