[package]
name = "maenifold-gate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gate"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31.1", default-features = true }
egui_commonmark = { version = "0.20.0", default-features = false, features = ["pulldown_cmark"] }
egui_extras = "0.31.1"
indexmap = { version = "2", features = ["serde"] }
libc.workspace = true
maenifold-core = { path = "../maenifold-core" }
notify.workspace = true
regex.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
tower-http.workspace = true
tray-icon = "0.21"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[lints]
workspace = true
