[package]
name = "maenifold-core"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = ["app"]
app = []
model-download = ["dep:hf-hub"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
backon.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
jockey = { package = "maenifold-jockey", path = "../maenifold-jockey" }
maenifold-gate-core = { path = "../maenifold-gate-core" }
keyring = { version = "3", features = ["apple-native"] }
libc.workspace = true
machine-uid = "0.5"
notify.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
petgraph = { version = "0.8", features = ["stable_graph", "serde-1"] }
pulldown-cmark.workspace = true
regex.workspace = true
croner = "3.0.1"
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_yml.workspace = true
handlebars = "6"
html_escape = { package = "html-escape", version = "0.2" }
jsonschema = { version = "0.28", default-features = false }
sha2.workspace = true
slug.workspace = true
rust-embed.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
agent-client-protocol = { workspace = true }
agent-client-protocol-schema = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
reqwest.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http.workspace = true
uuid.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
tempfile.workspace = true
fd-lock.workspace = true
ort.workspace = true
tokenizers.workspace = true
unicode-normalization = "0.1"
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"], optional = true }
# T-29.2: RTM FR-35 — system tray icon for --web/--http modes on macOS.
tray-icon.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[dev-dependencies]
reqwest.workspace = true
serial_test = "3"
tempfile.workspace = true
tower = "0.5"

[[test]]
name = "gateway_integration"
path = "tests/gateway_integration.rs"

[[test]]
name = "gateway_streamable_http"
path = "tests/gateway_streamable_http.rs"

[[test]]
name = "gateway_streamable_http_cors"
path = "tests/gateway_streamable_http_cors.rs"

[[test]]
name = "list_memories_dataless"
path = "tests/list_memories_dataless.rs"









[lints]
workspace = true
