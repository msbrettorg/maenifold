# T-9.5: RTM FR-9 (RTM-062, RTM-064, RTM-065)
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # T-9.5: RTM FR-9 (RTM-062) - Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: maenifold-osx-arm64
          # T-9.5: RTM FR-9 (RTM-064) - Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: maenifold-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build maenifold-cli
        run: cargo build --release --target ${{ matrix.target }} -p maenifold-cli

      - name: Build maenifold-pipeline-driver
        run: cargo build --release --target ${{ matrix.target }} -p maenifold-pipeline-driver

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/maenifold" staging/
          cp "target/${{ matrix.target }}/release/maenifold-pipeline-driver" staging/
          rsync -a --exclude='*.onnx' assets/ staging/assets/
          for f in readme.md CHANGELOG.md AGENTS.md; do
            if [ -f "$f" ]; then cp "$f" staging/; fi
          done
          cd staging && zip -r "../${{ matrix.artifact }}.zip" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/maenifold.exe" staging/
          Copy-Item "target/${{ matrix.target }}/release/maenifold-pipeline-driver.exe" staging/
          robocopy assets staging\assets /E /XF *.onnx /NFL /NDL /NJH /NJS /NP /R:2 /W:2 | Out-Host
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          foreach ($f in @('readme.md', 'CHANGELOG.md', 'AGENTS.md')) {
            if (Test-Path $f) { Copy-Item $f staging/ }
          }
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Smoke test binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./staging/maenifold.exe --version || ./staging/maenifold.exe --help | head -n 1
            ./staging/maenifold-pipeline-driver.exe --help 2>&1 | head -n 1 || true
          else
            ./staging/maenifold --version || ./staging/maenifold --help | head -n 1
            ./staging/maenifold-pipeline-driver --help 2>&1 | head -n 1 || true
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.zip' -print -quit)"
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes
