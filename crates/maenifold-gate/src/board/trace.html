<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Trace — Gate</title>
  <style>
    :root {
      --bg: #252525;
      --card: #1e2028;
      --border: #404040;
      --incoming: #3b82f6;
      --outgoing: #22c55e;
      --error: #ef4444;
      --text: #e0e0e0;
      --muted: #6b7280;
      --radius: 4px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 "SF Mono", "Fira Code", monospace;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #1f1f1f;
    }
    .title-group, .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title {
      margin: 0;
      font-size: 18px;
    }
    .badge, .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    .badge {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
    }
    .toggle input { accent-color: var(--incoming); }
    .close-button {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .entry.incoming { border-left-color: var(--incoming); }
    .entry.outgoing { border-left-color: var(--outgoing); }
    .entry.error { border-left-color: var(--error); }
    .entry-header {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .entry-header:hover { background: rgba(255, 255, 255, 0.02); }
    .arrow {
      font-size: 16px;
      font-weight: 700;
      width: 16px;
      text-align: center;
      flex: 0 0 auto;
    }
    .entry.incoming .arrow { color: var(--incoming); }
    .entry.outgoing .arrow { color: var(--outgoing); }
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }
    .timestamp, .session, .summary {
      color: var(--muted);
      font-size: 12px;
    }
    .method {
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .body {
      display: none;
      padding: 0 14px 14px;
    }
    .entry.expanded .body { display: block; }
    pre {
      margin: 0;
      padding: 12px;
      max-height: 300px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #191b22;
      color: var(--text);
      font: 12px/1.5 "SF Mono", "Fira Code", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 800px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .entry-header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <h1 class="title">MCP Trace — Gate</h1>
        <span class="badge" id="entry-count">0 / 20</span>
      </div>
      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="auto-scroll" checked>
          <span>Auto-scroll</span>
        </label>
        <button id="refresh">Refresh</button>
        <button id="clear">Clear</button>
        <button id="close" class="close-button" aria-label="Close trace view">×</button>
      </div>
    </header>
    <main class="list" id="trace-list">
      <div class="empty">Waiting for MCP traffic…</div>
    </main>
  </div>
  <script>
    const state = {
      entries: [],
      hiddenKeys: new Set(),
      seenKeys: new Set(),
      lastServerCount: 0,
    };

    function entryKey(entry) {
      return [
        entry.timestamp,
        entry.direction,
        entry.method,
        JSON.stringify(entry.id ?? null),
        entry.session_id ?? "",
        entry.body,
      ].join("|");
    }

    function formatSessionId(sessionId) {
      return sessionId ? sessionId.slice(0, 8) : "--------";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"]/g, ch => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]
      ));
    }

    function isErrorEntry(entry) {
      return String(entry.body || "").toLowerCase().includes("error");
    }

    function render() {
      const container = document.getElementById("trace-list");
      const visibleEntries = state.entries.filter(entry => !state.hiddenKeys.has(entry.key));
      document.getElementById("entry-count").textContent = `${visibleEntries.length} / 20`;

      if (!visibleEntries.length) {
        container.innerHTML = '<div class="empty">No visible entries.</div>';
        return;
      }

      container.innerHTML = visibleEntries.map(entry => `
        <article class="entry ${entry.directionClass}${entry.error ? " error" : ""}" data-entry-key="${escapeHtml(entry.key)}">
          <button class="entry-header" type="button">
            <span class="arrow">${entry.arrow}</span>
            <div class="meta">
              <span class="timestamp">${escapeHtml(entry.timestamp)}</span>
              <span class="method">${escapeHtml(entry.method)}</span>
              <span class="session">${escapeHtml(formatSessionId(entry.session_id))}</span>
              <span class="summary">${entry.expanded ? "collapse" : "expand"}</span>
            </div>
          </button>
          <div class="body">
            <pre>${escapeHtml(entry.body)}</pre>
          </div>
        </article>
      `).join("");

      container.querySelectorAll("[data-entry-key]").forEach(node => {
        node.querySelector(".entry-header").addEventListener("click", () => {
          const entry = state.entries.find(item => item.key === node.dataset.entryKey);
          if (!entry) return;
          entry.expanded = !entry.expanded;
          render();
        });
      });

      if (document.getElementById("auto-scroll").checked) {
        container.scrollTop = 0;
      }
    }

    async function refreshTrace() {
      const response = await fetch("/trace/data", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Trace request failed: ${response.status}`);
      }

      const data = await response.json();
      const serverCount = Array.isArray(data) ? data.length : 0;
      const freshEntries = [];

      for (const entry of data) {
        const key = entryKey(entry);
        if (state.seenKeys.has(key)) continue;
        state.seenKeys.add(key);
        freshEntries.push({
          ...entry,
          key,
          expanded: false,
          error: isErrorEntry(entry),
          arrow: entry.direction === "Incoming" ? "→" : "←",
          directionClass: entry.direction === "Incoming" ? "incoming" : "outgoing",
        });
      }

      for (const entry of freshEntries) {
        state.entries.unshift(entry);
      }

      state.lastServerCount = serverCount;
      render();
    }

    document.getElementById("refresh").addEventListener("click", () => {
      refreshTrace().catch(console.error);
    });

    document.getElementById("clear").addEventListener("click", () => {
      state.entries.forEach(entry => state.hiddenKeys.add(entry.key));
      render();
    });

    document.getElementById("close").addEventListener("click", () => {
      window.location.href = "/";
    });

    refreshTrace().catch(console.error);
    setInterval(() => {
      refreshTrace().catch(console.error);
    }, 2000);
  </script>
</body>
</html>
