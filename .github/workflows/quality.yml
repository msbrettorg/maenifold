# T-71.1: Quality reporting workflow
name: Quality Metrics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    if: github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: clippy, llvm-tools-preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install quality tools
        run: |
          cargo install cargo-llvm-cov --locked
          cargo install cargo-machete --locked
          cargo install rust-code-analysis-cli --locked
          npm install -g jscpd

      - name: Generate quality reports
        run: make quality-report

      - name: Publish quality summary
        run: cat target/quality/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: target/quality
