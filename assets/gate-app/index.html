<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Board</title>
  <!-- MAENIFOLD_STYLE -->
</head>
<body>
  <main>
    <header>
      <h1 id="title">Gate Board</h1>
      <div class="status" id="gate-status">No gate status loaded</div>
    </header>
    <div class="stats" aria-label="Gate board totals">
      <div class="stat"><b id="task-count">0</b><span>Tasks</span></div>
      <div class="stat"><b id="stage-count">0</b><span>Stages</span></div>
      <div class="stat"><b id="stale-count">0</b><span>Stale &gt;24h</span></div>
    </div>
    <div class="content">
      <section class="board">
        <div class="empty" id="empty">No gate tasks found.</div>
        <div class="kanban-grid" id="kanban-grid" hidden></div>
      </section>
      <aside>
        <section>
          <h2>Selected task</h2>
          <div class="detail" id="selected-task">Select a task card.</div>
        </section>
        <section>
          <h2>Most recent gate record</h2>
          <div class="detail" id="selected-record">No record selected.</div>
        </section>
      </aside>
    </div>
  </main>
  <script type="application/json" id="gate-data"></script>
  <!-- MAENIFOLD_SCRIPT -->
</body>
</html>
