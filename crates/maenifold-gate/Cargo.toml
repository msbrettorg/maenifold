[package]
name = "maenifold-gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "gate"
path = "src/main.rs"

[features]
default = []
app = [
  "dep:axum",
  "dep:rust-embed",
  "dep:rmcp",
  "dep:open",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tower-http",
  "dep:tray-icon",
  "dep:winit",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
chrono.workspace = true
gray_matter.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
strum.workspace = true
thiserror.workspace = true
walkdir.workspace = true
directories.workspace = true
axum = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, features = ["transport-streamable-http-server"] }
open = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
