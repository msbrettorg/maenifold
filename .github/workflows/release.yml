# T-9.5: RTM FR-9 (RTM-062, RTM-064)
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.2"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: maenifold-macos-arm64-dmg
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: maenifold-windows-x64-msi
            bundles: msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.dmg' -exec cp {} dist/ \;
          find artifacts -name '*.msi' -exec cp {} dist/ \;
          dmg_count=$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          msi_count=$(find dist -maxdepth 1 -name '*.msi' | wc -l | tr -d ' ')
          if [ "$dmg_count" -ne 1 ] || [ "$msi_count" -ne 1 ]; then
            echo "expected one .dmg and one .msi, found dmg=$dmg_count msi=$msi_count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          cd dist
          sha256sum *.dmg *.msi > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.msi dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes
