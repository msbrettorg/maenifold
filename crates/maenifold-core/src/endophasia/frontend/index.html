<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endophasia</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #131313;
      --panel: #171717;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.52);
      --writing: #0078d4;
      --thinking: #107c10;
      --exploring: #ffb900;
      --remembering: #d83b01;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.03), transparent 34%),
        radial-gradient(circle at 50% 78%, rgba(0,120,212,0.06), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 24px);
    }

    .shell {
      position: relative;
      width: min(100%, 1200px);
      height: min(88vh, 760px);
      min-height: 420px;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 24%),
        linear-gradient(90deg, rgba(0,120,212,0.035), transparent 22%, transparent 78%, rgba(216,59,1,0.035)),
        var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .chrome {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 10px;
      z-index: 4;
      pointer-events: none;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 14px currentColor;
    }

    .status {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .status.live {
      color: rgba(255,255,255,0.85);
      border-color: rgba(16,124,16,0.28);
      background: rgba(16,124,16,0.11);
    }

    .status.reconnecting {
      color: rgba(255,255,255,0.85);
      border-color: rgba(255,185,0,0.26);
      background: rgba(255,185,0,0.12);
    }

    .status.waiting {
      border-color: rgba(0,120,212,0.22);
      background: rgba(0,120,212,0.11);
    }

    .viz-wrap {
      position: absolute;
      inset: 0;
    }

    #viz {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-note {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: none;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .wordmark {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.14);
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      font-style: italic;
      font-size: clamp(16px, 1.8vw, 22px);
      letter-spacing: 0.3em;
      text-transform: lowercase;
      pointer-events: none;
      z-index: 3;
    }

    @media (max-width: 720px) {
      .shell { min-height: 360px; border-radius: 14px; }
      .chrome { align-items: flex-start; flex-direction: column; }
      .status { align-self: flex-start; }
      .wordmark { bottom: 10px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="chrome">
      <div class="legend" aria-label="Legend">
        <span class="legend-item"><span class="legend-dot" style="color: var(--writing); background: var(--writing);"></span>Writing</span>
        <span class="legend-item"><span class="legend-dot" style="color: var(--thinking); background: var(--thinking);"></span>Thinking</span>
        <span class="legend-item"><span class="legend-dot" style="color: var(--exploring); background: var(--exploring);"></span>Exploring</span>
        <span class="legend-item"><span class="legend-dot" style="color: var(--remembering); background: var(--remembering);"></span>Remembering</span>
      </div>
      <div id="status" class="status waiting">Waiting for activity...</div>
    </div>
    <div class="viz-wrap">
      <svg id="viz" role="img" aria-label="Endophasia concept activity streams over community substrate"></svg>
      <div id="empty-note" class="overlay-note">No communities detected</div>
    </div>
    <div class="wordmark">endophasia</div>
  </div>

  <script>
    const SIGNALS = {
      writing: { color: "#0078d4", lane: "left" },
      thinking: { color: "#107c10", lane: "right" },
      exploring: { color: "#ffb900", lane: "right" },
      remembering: { color: "#d83b01", lane: "right" }
    };

    const svg = d3.select("#viz");
    const statusEl = document.getElementById("status");
    const emptyNote = document.getElementById("empty-note");
    const root = svg.append("g");
    const defs = svg.append("defs");
    const glow = defs.append("filter").attr("id", "glow");
    glow.append("feGaussianBlur").attr("stdDeviation", 4).attr("result", "blur");
    glow.append("feMerge").selectAll("feMergeNode").data(["blur", "SourceGraphic"]).join("feMergeNode").attr("in", d => d);

    const layers = {
      guides: root.append("g"),
      links: root.append("g"),
      halos: root.append("g"),
      concepts: root.append("g"),
      tugs: root.append("g"),
      particles: root.append("g"),
      labels: root.append("g")
    };

    const state = {
      width: 0,
      height: 0,
      hasSeenEvent: false,
      isReconnecting: false,
      communityData: { communities: [], edges: [] },
      communityCache: new Map(),
      communityAbsenceCounts: new Map(),
      communitySnapshots: new Map(),
      previousCommunityIds: new Set(),
      communityFetchGeneration: 0,
      communityNodes: [],
      conceptNodes: [],
      conceptIndex: new Map(),
      particles: [],
      tugs: [],
      recentConcepts: [],
      eventSource: null,
      reconnectTimer: null,
      communitiesTimer: null,
      particleId: 0,
      tugId: 0
    };

    const normalize = value => String(value || "").trim().toLowerCase();
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const laneX = side => side === "left" ? state.width * 0.16 : state.width * 0.84;
    const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setStatus(text, mode) {
      statusEl.textContent = text;
      statusEl.className = "status " + mode;
    }

    function updateStatus() {
      if (state.isReconnecting) return setStatus("Reconnecting...", "reconnecting");
      if (!state.hasSeenEvent) return setStatus("Waiting for activity...", "waiting");
      setStatus("Streaming", "live");
    }

    function rememberConcept(concept) {
      const normalized = normalize(concept);
      if (!normalized) return;
      state.recentConcepts = [normalized, ...state.recentConcepts.filter(item => item !== normalized)].slice(0, 12);
    }

    function spawnParticle(event) {
      const signal = normalize(event.signal);
      if (!SIGNALS[signal]) return;
      const lane = SIGNALS[signal].lane;
      state.particles.push({
        id: ++state.particleId,
        concept: event.concept,
        signal,
        lane,
        color: SIGNALS[signal].color,
        bornAt: Date.now(),
        ttl: 9000 + Math.random() * 2200,
        xBase: laneX(lane) + (Math.random() - 0.5) * 26,
        sway: 6 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2
      });
      rememberConcept(event.concept);
      state.hasSeenEvent = true;
      state.isReconnecting = false;
      updateStatus();
      triggerTug(event.concept, signal);
    }

    function aggregateLinks(edges, conceptToCommunity) {
      const grouped = new Map();
      (edges || []).forEach(edge => {
        const a = conceptToCommunity.get(normalize(edge.source));
        const b = conceptToCommunity.get(normalize(edge.target));
        if (a == null || b == null || a === b) return;
        const key = a < b ? `${a}:${b}` : `${b}:${a}`;
        grouped.set(key, (grouped.get(key) || 0) + Number(edge.weight || 0));
      });
      return [...grouped.entries()].map(([key, weight]) => {
        const [source, target] = key.split(":").map(Number);
        return { source, target, weight };
      });
    }

    function communityTransform(node, scale = 1) {
      return `translate(${node.x},${node.y}) scale(${scale})`;
    }

    function finalizeEmptyState() {
      if (!state.communityNodes.length && layers.halos.selectAll("g.community").empty()) {
        emptyNote.style.display = "block";
      }
    }

    function clearCommunityTransitionState(node, token) {
      requestAnimationFrame(() => {
        if (node.__communityTransitionToken === token && node.isConnected) {
          d3.select(node).attr("data-transition-state", null);
        }
      });
    }

    function renderCommunities(links, exitingNodes = []) {
      layers.guides.selectAll("*").remove();
      layers.guides.append("line")
        .attr("x1", laneX("left")).attr("x2", laneX("left"))
        .attr("y1", state.height * 0.08).attr("y2", state.height * 0.92)
        .attr("stroke", "rgba(0,120,212,0.24)").attr("stroke-width", 1);
      layers.guides.append("line")
        .attr("x1", laneX("right")).attr("x2", laneX("right"))
        .attr("y1", state.height * 0.08).attr("y2", state.height * 0.92)
        .attr("stroke", "rgba(216,59,1,0.18)").attr("stroke-width", 1);

      const reducedMotion = prefersReducedMotion();
      const renderNodes = [...state.communityNodes, ...exitingNodes];
      const communityById = new Map(renderNodes.map(node => [node.id, node]));
      layers.links.selectAll("line")
        .data(links || [], d => `${d.source}-${d.target}`)
        .join("line")
        .attr("x1", d => communityById.get(d.source)?.x || 0)
        .attr("y1", d => communityById.get(d.source)?.y || 0)
        .attr("x2", d => communityById.get(d.target)?.x || 0)
        .attr("y2", d => communityById.get(d.target)?.y || 0)
        .attr("stroke", "rgba(255,255,255,0.08)")
        .attr("stroke-width", d => Math.max(0.6, Math.min(2.4, (d.weight || 1) / 14)));

      const groups = layers.halos.selectAll("g.community")
        .data(renderNodes, d => d.id);

      groups.exit().each(function() {
        const group = d3.select(this);
        const hasActiveCommunityUpdate = Boolean(d3.active(this, "community-update"));
        const isExiting = group.attr("data-transition-state") === "exiting";

        if (hasActiveCommunityUpdate && isExiting) {
          return;
        }

        group.remove();
      });

      const entered = groups.enter()
        .append("g")
        .attr("class", "community")
        .attr("data-community-id", d => d.id);

      entered.append("circle")
        .attr("cx", 0)
        .attr("cy", 0)
        .attr("fill", "rgba(255,255,255,0.028)");

      entered.append("text")
        .attr("x", 0)
        .attr("text-anchor", "middle")
        .attr("fill", "rgba(255,255,255,0.34)")
        .attr("font-size", 9)
        .attr("letter-spacing", "0.16em");

      entered.merge(groups)
        .attr("data-community-id", d => d.id)
        .each(function(d) {
          const group = d3.select(this);
          const node = this;
          const token = `${Date.now()}:${d.id}:${d.transitionState || "stable"}`;
          node.__communityTransitionToken = token;

          group.select("circle")
            .attr("r", d.r);

          group.select("text")
            .attr("y", -d.r - 10)
            .text(d.anchor);

          if (d.transitionState === "entering") {
            group
              .attr("data-transition-state", "entering")
              .attr("opacity", reducedMotion ? 1 : 0.05)
              .attr("transform", reducedMotion ? communityTransform(d, 1) : communityTransform(d, 0.85));

            if (reducedMotion) {
              group
                .attr("opacity", 1)
                .attr("transform", communityTransform(d, 1))
                .attr("data-transition-state", null);
              return;
            }

            group.transition("community-update")
              .duration(3200)
              .ease(d3.easeCubicOut)
              .attr("opacity", 1)
              .attr("transform", communityTransform(d, 1))
              .on("end", function() {
                if (this.__communityTransitionToken === token) {
                  d3.select(this).attr("data-transition-state", null);
                }
              });
            return;
          }

          if (d.transitionState === "exiting") {
            group
              .attr("data-transition-state", "exiting")
              .attr("opacity", 1)
              .attr("transform", communityTransform(d, 1));

            if (reducedMotion) {
              group.remove();
              finalizeEmptyState();
              return;
            }

            group.transition("community-update")
              .duration(2800)
              .ease(d3.easeCubicIn)
              .attr("opacity", 0.05)
              .attr("transform", communityTransform(d, 0.72))
              .on("end", function() {
                if (this.__communityTransitionToken === token) {
                  d3.select(this).remove();
                  finalizeEmptyState();
                }
              });
            return;
          }

          group.interrupt("community-update");
          group
            .attr("data-transition-state", "persistent")
            .attr("opacity", 1)
            .attr("transform", communityTransform(d, 1));
          clearCommunityTransitionState(node, token);
        });
    }

    function buildLayout(data, options = {}) {
      const reflowOnly = options.reflowOnly === true;
      const incomingCommunities = reflowOnly ? (data.communities || []).slice() : (data.communities || []).slice(0, 10);
      const previousSnapshots = state.communitySnapshots;
      const previousCommunityIds = new Set(state.previousCommunityIds);
      const incomingById = new Map(incomingCommunities.map(community => [Number(community.id), community]));
      const persistentIds = new Set();
      const enteringIds = new Set();
      const exitingIds = new Set();
      const activeCommunities = incomingCommunities.slice();

      if (!reflowOnly) {
        incomingCommunities.forEach(community => {
          const id = Number(community.id);
          state.communityCache.set(id, community);
          state.communityAbsenceCounts.delete(id);
          if (previousCommunityIds.has(id)) {
            persistentIds.add(id);
          } else {
            enteringIds.add(id);
          }
        });

        previousCommunityIds.forEach(id => {
          if (incomingById.has(id)) return;
          const misses = (state.communityAbsenceCounts.get(id) || 0) + 1;
          state.communityAbsenceCounts.set(id, misses);
          if (misses >= 2) {
            exitingIds.add(id);
            state.communityAbsenceCounts.delete(id);
            state.communityCache.delete(id);
            return;
          }

          const cachedCommunity = state.communityCache.get(id);
          if (cachedCommunity) {
            persistentIds.add(id);
            activeCommunities.push(cachedCommunity);
          }
        });
      } else {
        incomingCommunities.forEach(community => persistentIds.add(Number(community.id)));
      }

      const exitingNodes = [...exitingIds]
        .map(id => previousSnapshots.get(id))
        .filter(Boolean)
        .map(snapshot => ({ ...snapshot, transitionState: "exiting" }));

      if (!activeCommunities.length) {
        state.communityData = { communities: [], edges: data.edges || [] };
        state.communityNodes = [];
        state.conceptNodes = [];
        state.conceptIndex = new Map();
        layers.links.selectAll("*").remove();
        layers.concepts.selectAll("*").remove();
        layers.labels.selectAll("*").remove();
        layers.tugs.selectAll("*").remove();
        if (exitingNodes.length) {
          emptyNote.style.display = "none";
          renderCommunities([], exitingNodes);
        } else {
          layers.halos.selectAll("*").remove();
          emptyNote.style.display = "block";
        }
        state.communitySnapshots = new Map();
        state.previousCommunityIds = new Set();
        return;
      }

      emptyNote.style.display = "none";
      const scores = activeCommunities.map(d => Number(d.anchor_score) || 0.01);
      const radiusScale = d3.scaleSqrt()
        .domain([d3.min(scores), Math.max(d3.max(scores), d3.min(scores) + 0.0001)])
        .range([34, 58]);

      const cols = state.width < 720 ? 2 : 3;
      const rows = Math.ceil(activeCommunities.length / cols);
      const x0 = state.width * 0.33;
      const x1 = state.width * 0.67;
      const y0 = state.height * 0.22;
      const y1 = state.height * 0.74;

      const communityNodes = activeCommunities.map((community, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        const tx = d3.interpolateNumber(x0, x1)(cols === 1 ? 0.5 : col / (cols - 1 || 1));
        const ty = d3.interpolateNumber(y0, y1)(rows === 1 ? 0.5 : row / (rows - 1 || 1));
        const id = Number(community.id);
        const previous = previousSnapshots.get(id);
        return {
          id,
          concepts: community.concepts || [],
          anchor: community.concepts && community.concepts[0] ? community.concepts[0] : `community-${community.id}`,
          r: radiusScale(Number(community.anchor_score) || 0.01),
          x: previous && persistentIds.has(id) ? previous.x : tx,
          y: previous && persistentIds.has(id) ? previous.y : ty,
          tx,
          ty,
          transitionState: enteringIds.has(id) ? "entering" : "persistent"
        };
      });

      const conceptToCommunity = new Map();
      activeCommunities.forEach(community => (community.concepts || []).forEach(concept => conceptToCommunity.set(normalize(concept), Number(community.id))));
      const links = aggregateLinks(data.edges, conceptToCommunity);

      d3.forceSimulation(communityNodes)
        .force("x", d3.forceX(d => d.tx).strength(0.18))
        .force("y", d3.forceY(d => d.ty).strength(0.18))
        .force("charge", d3.forceManyBody().strength(-260))
        .force("collide", d3.forceCollide().radius(d => d.r + 34))
        .force("link", d3.forceLink(links.map(link => ({ ...link }))).id(d => d.id).distance(link => 100 - Math.min(link.weight || 0, 40)).strength(0.22))
        .stop()
        .tick(220);

      communityNodes.forEach(community => {
        const previous = previousSnapshots.get(community.id);
        if (!previous || !persistentIds.has(community.id)) return;
        const dx = community.x - previous.x;
        const dy = community.y - previous.y;
        const distance = Math.hypot(dx, dy);
        if (distance > 8) {
          const factor = 8 / distance;
          community.x = previous.x + dx * factor;
          community.y = previous.y + dy * factor;
        }
      });

      const conceptNodes = [];
      const conceptIndex = new Map();
      const anchorPositions = new Map();
      communityNodes.forEach((community, communityIndex) => {
        const spiral = Math.PI * (3 - Math.sqrt(5));
        const previous = previousSnapshots.get(community.id);
        community.concepts.forEach((concept, index) => {
          const radius = 18 + Math.sqrt(index + 1) * 10 + Math.min(community.r * 0.15, 8);
          const angle = spiral * index + communityIndex * 0.7;
          const preserveAnchorPosition = index === 0 && previous && persistentIds.has(community.id) && Number.isFinite(previous.anchorBaseX) && Number.isFinite(previous.anchorBaseY);
          const node = {
            key: `${community.id}:${concept}`,
            concept,
            normalized: normalize(concept),
            communityId: community.id,
            anchor: index === 0,
            baseX: preserveAnchorPosition
              ? previous.anchorBaseX
              : clamp(community.x + Math.cos(angle) * radius * 1.1, state.width * 0.24, state.width * 0.76),
            baseY: preserveAnchorPosition
              ? previous.anchorBaseY
              : clamp(community.y + Math.sin(angle) * radius * 0.82, state.height * 0.14, state.height * 0.86),
            ox: 0,
            oy: 0,
            vx: 0,
            vy: 0,
            glowColor: null,
            glowUntil: 0
          };
          conceptNodes.push(node);
          conceptIndex.set(node.normalized, node);
          if (node.anchor) {
            anchorPositions.set(community.id, { baseX: node.baseX, baseY: node.baseY });
          }
        });
      });

      state.communityData = { communities: activeCommunities, edges: data.edges || [] };
      state.communityNodes = communityNodes;
      state.conceptNodes = conceptNodes;
      state.conceptIndex = conceptIndex;

      state.communitySnapshots = new Map(communityNodes.map(community => {
        const anchorPosition = anchorPositions.get(community.id) || {};
        return [community.id, {
          id: community.id,
          anchor: community.anchor,
          concepts: community.concepts,
          r: community.r,
          x: community.x,
          y: community.y,
          anchorBaseX: anchorPosition.baseX,
          anchorBaseY: anchorPosition.baseY
        }];
      }));
      state.previousCommunityIds = new Set(communityNodes.map(community => community.id));
      renderCommunities(links, exitingNodes);
    }

    function triggerTug(concept, signal) {
      const node = state.conceptIndex.get(normalize(concept));
      if (!node) return;
      const direction = signal === "writing" ? -1 : 1;
      const impulse = signal === "exploring" ? 17 : signal === "remembering" ? 15 : 13;
      node.vx += direction * impulse;
      node.vy += (Math.random() - 0.5) * 3;
      node.glowColor = SIGNALS[signal].color;
      node.glowUntil = Date.now() + 1450;
      state.tugs.push({
        id: ++state.tugId,
        concept: node.normalized,
        side: direction < 0 ? "left" : "right",
        color: SIGNALS[signal].color,
        bornAt: Date.now(),
        ttl: 900
      });
    }

    async function fetchCommunities() {
      const generation = ++state.communityFetchGeneration;
      const params = new URLSearchParams();
      if (state.recentConcepts.length) params.set("context", state.recentConcepts.join(","));
      const url = "/api/endophasia/communities" + (params.toString() ? `?${params}` : "");
      const response = await fetch(url, { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`communities ${response.status}`);
      const payload = await response.json();
      if (generation !== state.communityFetchGeneration) return;
      buildLayout(payload);
    }

    function scheduleCommunities() {
      if (state.communitiesTimer) clearInterval(state.communitiesTimer);
      state.communitiesTimer = setInterval(() => fetchCommunities().catch(err => console.error("[endophasia] community fetch failed:", err)), 20000);
    }

    function connectStream(delay = 0) {
      if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
      state.reconnectTimer = setTimeout(() => {
        if (state.eventSource) state.eventSource.close();
        state.eventSource = new EventSource("/api/endophasia/stream");
        state.eventSource.onopen = () => {
          state.isReconnecting = false;
          updateStatus();
        };
        state.eventSource.onmessage = event => {
          try {
            spawnParticle(JSON.parse(event.data));
          } catch (err) {
            console.error("[endophasia] SSE parse error:", err);
          }
        };
        state.eventSource.addEventListener("lagged", event => {
          try {
            const payload = JSON.parse(event.data);
            setStatus(`Streaming · catching up (${payload.skipped || 0})`, "live");
            setTimeout(updateStatus, 1800);
          } catch (err) {
            console.error("[endophasia] SSE parse error:", err);
          }
        });
        state.eventSource.onerror = () => {
          state.isReconnecting = true;
          updateStatus();
          if (state.eventSource) state.eventSource.close();
          connectStream(1800);
        };
      }, delay);
    }

    function resize() {
      const box = svg.node().getBoundingClientRect();
      state.width = Math.max(320, box.width);
      state.height = Math.max(280, box.height);
      svg.attr("viewBox", `0 0 ${state.width} ${state.height}`);
      if (state.communityData.communities.length) buildLayout(state.communityData, { reflowOnly: true });
    }

    function tick() {
      const now = Date.now();

      state.conceptNodes.forEach(node => {
        node.vx += -node.ox * 0.11;
        node.vy += -node.oy * 0.11;
        node.vx *= 0.76;
        node.vy *= 0.76;
        node.ox += node.vx;
        node.oy += node.vy;
        if (Math.abs(node.ox) < 0.02 && Math.abs(node.vx) < 0.02) node.ox = node.vx = 0;
        if (Math.abs(node.oy) < 0.02 && Math.abs(node.vy) < 0.02) node.oy = node.vy = 0;
      });

      state.tugs = state.tugs.filter(tug => now - tug.bornAt < tug.ttl);
      state.particles = state.particles.filter(p => now - p.bornAt < p.ttl);

      layers.tugs.selectAll("line")
        .data(state.tugs, d => d.id)
        .join("line")
        .attr("x1", d => laneX(d.side))
        .attr("y1", d => state.height * 0.12)
        .attr("x2", d => (state.conceptIndex.get(d.concept)?.baseX || 0) + (state.conceptIndex.get(d.concept)?.ox || 0))
        .attr("y2", d => (state.conceptIndex.get(d.concept)?.baseY || 0) + (state.conceptIndex.get(d.concept)?.oy || 0))
        .attr("stroke", d => d.color)
        .attr("stroke-width", 1.2)
        .attr("opacity", d => 0.55 * (1 - (now - d.bornAt) / d.ttl));

      layers.concepts.selectAll("circle")
        .data(state.conceptNodes, d => d.key)
        .join("circle")
        .attr("cx", d => d.baseX + d.ox)
        .attr("cy", d => d.baseY + d.oy)
        .attr("r", d => d.anchor ? 4.1 : 3.1)
        .attr("fill", d => now < d.glowUntil ? d.glowColor : (d.anchor ? "rgba(255,255,255,0.92)" : "rgba(255,255,255,0.72)"))
        .attr("filter", d => now < d.glowUntil ? "url(#glow)" : null)
        .attr("opacity", d => d.anchor ? 1 : 0.78);

      layers.labels.selectAll("text")
        .data(state.conceptNodes.filter(d => d.anchor || d.communityId % 2 === 0), d => d.key)
        .join("text")
        .attr("x", d => d.baseX + d.ox + 7)
        .attr("y", d => d.baseY + d.oy + 2)
        .attr("fill", d => now < d.glowUntil ? d.glowColor : "rgba(255,255,255,0.34)")
        .attr("font-size", 8)
        .attr("letter-spacing", "0.04em")
        .attr("opacity", d => d.anchor ? 0.9 : 0.55)
        .text(d => d.concept);

      layers.particles.selectAll("circle")
        .data(state.particles, d => d.id)
        .join("circle")
        .attr("cx", d => d.xBase + Math.sin((now - d.bornAt) / 420 + d.phase) * d.sway)
        .attr("cy", d => ((now - d.bornAt) / d.ttl) * (state.height + 48) - 24)
        .attr("r", d => d.signal === "writing" ? 4.2 : 3.8)
        .attr("fill", d => d.color)
        .attr("opacity", d => {
          const age = now - d.bornAt;
          const fade = 1 - age / d.ttl;
          return Math.max(0, Math.min(1, age < 500 ? age / 500 : fade * 0.95));
        });

      layers.particles.selectAll("text")
        .data(state.particles, d => d.id)
        .join("text")
        .attr("x", d => d.xBase + Math.sin((now - d.bornAt) / 420 + d.phase) * d.sway + (d.lane === "left" ? 10 : -10))
        .attr("y", d => ((now - d.bornAt) / d.ttl) * (state.height + 48) - 28)
        .attr("text-anchor", d => d.lane === "left" ? "start" : "end")
        .attr("fill", d => d.color)
        .attr("font-size", 9)
        .attr("letter-spacing", "0.08em")
        .attr("opacity", d => {
          const age = now - d.bornAt;
          if (age > 4600) return 0;
          return 0.7 * (1 - age / 4600);
        })
        .text(d => d.concept);
    }

    async function boot() {
      resize();
      try {
        await fetchCommunities();
      } catch (err) {
        console.error("[endophasia] community fetch failed:", err);
      }
      scheduleCommunities();
      connectStream();
      d3.timer(tick);
      new ResizeObserver(resize).observe(svg.node());
    }

    boot();
  </script>
</body>
</html>
