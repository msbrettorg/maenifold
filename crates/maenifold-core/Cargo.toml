[package]
name = "maenifold-core"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
# T-17.1: RTM FR-23 (RTM-126) - gate Streamable HTTP transport deps behind `http`.
http = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:tower-http", "dep:tokio-util"]
web = ["http", "dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, optional = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
gray_matter.workspace = true
libc.workspace = true
mime_guess = { version = "2", optional = true }
notify = { version = "7", features = ["macos_fsevent"] }
once_cell.workspace = true
parking_lot.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path"], optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
slug.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
tokio-util = { workspace = true, optional = true, features = ["compat"] }
rmcp.workspace = true
tower-http = { workspace = true, optional = true }
uuid.workspace = true
walkdir.workspace = true
urlencoding.workspace = true
ort.workspace = true
tokenizers.workspace = true
ndarray = "0.16"

[dev-dependencies]
assert_cmd.workspace = true
ctor = "0.4"
predicates.workspace = true
reqwest.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true
filetime = "0.2.25"

[[test]]
# T-HOTFIX: RTM NFR-3
name = "integration_tests"
path = "tests/main.rs"
